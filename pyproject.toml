authors = [
    { name = "gaurav", email = "k7kumargaurav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk==1.3.0",
    "fastapi>=0.142.2",
    "ipykernel>=6.30.0",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
